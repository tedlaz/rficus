name: release

# Driven by the tag cargo-release pushes (see release.toml).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release and upload to it

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with the manifest would ship an installer whose
      # filename, Add/Remove Programs entry and exe resource each claim a
      # different version. Refuse instead.
      - name: Check the tag against Cargo.toml
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          # First match only: [package] comes first, and its version is the one
          # that ends up in the exe resource.
          $line = Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1
          $manifest = $line.Matches[0].Groups[1].Value
          if ($tag -ne $manifest) {
            throw "tag v$tag does not match Cargo.toml version $manifest"
          }
          "version=$tag" >> $env:GITHUB_OUTPUT

      # The runner already has Rust and InnoSetup, so there is nothing to install.
      - run: cargo test --locked

      - run: cargo build --release --locked

      - name: Build the installer
        shell: pwsh
        run: |
          # Preinstalled on the runner, but not on PATH; the LOCALAPPDATA entry
          # is where a per-user install puts it, so this same step works locally.
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source }
          if (-not $iscc) { throw "Inno Setup compiler not found" }
          & $iscc /DMyAppVersion=${{ steps.ver.outputs.version }} installer.iss

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            setup_rficus.${{ steps.ver.outputs.version }}.exe
            target/release/rficus.exe
